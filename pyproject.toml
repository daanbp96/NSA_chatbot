[project]
name = "nsa-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.103.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "debugpy>=1.8.20",
    "gradio>=6.14.0",
    "lxml>=6.1.1",
    "openai>=2.37.0",
    "pypdf>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
]

[tool.setuptools.packages.find]
include = ["nsa_chatbot*"]
