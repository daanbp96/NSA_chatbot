# Source registry for the No Surprises Act legal chatbot.
#
# Each source captures:
#   - jurisdiction:  federal | state code (e.g. IL, CA)
#   - kind:          statute | regulation | guidance
#   - citation:      canonical legal citation used in answers
#   - url:           authoritative public URL (used for fetch + linking back)
#   - fetcher:       which ingester implementation to use
#   - notes:         human notes about scope / what's included
#
# Adding a new source: append here, then re-run `python -m nsa_chatbot.ingest`.

federal:
  # Note: we do NOT pull Pub. L. 116-260 directly because the entire
